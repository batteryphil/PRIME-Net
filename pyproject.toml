[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-net"
version = "2.1.0"
description = "Pareto-Refined Invariant Mining Engine for Automated Symbolic Regression"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "batteryphil" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "sympy>=1.11.1",
    "pandas>=1.5.0",
    "numba>=0.56.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
benchmarks = [
    "pmlb>=1.0.0",
    "matplotlib>=3.5.0",
]
telemetry = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "gymnasium>=0.28.0",
]

[tool.setuptools]
py-modules = ["prime_core", "srbench_mud_test", "test_integrated_improvements"]
